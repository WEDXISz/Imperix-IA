<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMPΞRIX IA</title>

<style>
body{
margin:0;
background:#0d0f14;
font-family:Arial,sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:#fff;
}

.app{
width:100%;
max-width:500px;
height:100vh;
max-height:750px;
background:#111318;
display:flex;
flex-direction:column;
}

.header{
padding:15px;
background:#151822;
text-align:center;
font-weight:bold;
font-size:20px;
color:#00ff88;
}

.chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
padding:12px;
border-radius:12px;
max-width:80%;
word-break:break-word;
}

.user{
align-self:flex-end;
background:#00ff88;
color:#000;
}

.bot{
align-self:flex-start;
background:#1c1f2a;
}

.inputArea{
display:flex;
padding:10px;
background:#151822;
gap:10px;
}

#text{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#0d0f14;
color:#fff;
outline:none;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
background:#00ff88;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
🤖 IMPΞRIX IA
</div>

<div class="chat" id="chat"></div>

<div class="inputArea">
<input id="text" placeholder="Digite sua mensagem...">
<button onclick="send()">Enviar</button>
</div>

</div>

<script>

function add(text,type){
const div=document.createElement("div");
div.className="msg "+type;
div.innerText=text;
document.getElementById("chat").appendChild(div);
document.getElementById("chat").scrollTop=document.getElementById("chat").scrollHeight;
}

async function send(){

const input=document.getElementById("text");
const text=input.value.trim();

if(!text) return;

add(text,"user");
input.value="";

const loading=document.createElement("div");
loading.className="msg bot";
loading.innerText="🤖 Pensando...";
document.getElementById("chat").appendChild(loading);

try{

const response=await fetch("https://imperix-ia.onrender.com/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
text:text
})
});

const data=await response.json();

loading.remove();

add(
data.reply || "Sem resposta.",
"bot"
);

}catch(err){

loading.remove();

add(
"❌ Erro ao conectar ao servidor.",
"bot"
);

console.error(err);

}

}

document.getElementById("text").addEventListener("keypress",e=>{
if(e.key==="Enter"){
send();
}
});

</script>

</body>
</html>
