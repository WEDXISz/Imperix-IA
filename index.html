<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IMPΞRIX IA</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00ff88">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0d0f14;
font-family:Arial,sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.app{
width:100%;
max-width:500px;
height:100vh;
max-height:750px;
background:#111318;
display:flex;
flex-direction:column;
}

.header{
padding:16px;
text-align:center;
background:#151822;
color:#00ff88;
font-size:20px;
font-weight:bold;
}

.chat{
flex:1;
padding:15px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
padding:12px;
border-radius:12px;
max-width:80%;
word-wrap:break-word;
}

.user{
background:#00ff88;
color:#000;
align-self:flex-end;
}

.bot{
background:#1c1f2a;
align-self:flex-start;
}

.inputArea{
display:flex;
gap:10px;
padding:10px;
background:#151822;
}

#text{
flex:1;
padding:12px;
border:none;
outline:none;
border-radius:10px;
background:#0d0f14;
color:white;
}

button{
padding:12px 16px;
border:none;
border-radius:10px;
background:#00ff88;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
🤖 IMPΞRIX IA
</div>

<div class="chat" id="chat"></div>

<div class="inputArea">
<input id="text" placeholder="Digite sua mensagem...">
<button onclick="send()">➤</button>
</div>

</div>

<script>

const chat = document.getElementById("chat");

function add(text,type){

const div = document.createElement("div");

div.className = "msg " + type;
div.innerText = text;

chat.appendChild(div);
chat.scrollTop = chat.scrollHeight;
}

let deferredPrompt;

window.addEventListener("beforeinstallprompt",(e)=>{
e.preventDefault();
deferredPrompt = e;

const btn = document.createElement("button");

btn.innerText = "📲 Instalar IMPΞRIX";
btn.style.position = "fixed";
btn.style.bottom = "20px";
btn.style.right = "20px";

document.body.appendChild(btn);

btn.onclick = async ()=>{

await deferredPrompt.prompt();

};
});

async function send(){

const input = document.getElementById("text");
const text = input.value.trim();

if(!text) return;

if(text.toLowerCase() === "imperix app"){

add(text,"user");

add(
"📲 Para instalar o IMPΞRIX, toque no botão Instalar IMPΞRIX ou use o menu do navegador.",
"bot"
);

input.value="";
return;

}

add(text,"user");

input.value="";

const loading = document.createElement("div");
loading.className = "msg bot";
loading.innerText = "🤖 Pensando...";

chat.appendChild(loading);

try{

const response = await fetch("/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
text
})
});

const data = await response.json();

loading.remove();

add(
data.reply || "Sem resposta.",
"bot"
);

}catch(err){

loading.remove();

add(
"❌ Erro ao conectar ao servidor.",
"bot"
);

}

}

document.getElementById("text")
.addEventListener("keydown",(e)=>{
if(e.key==="Enter"){
send();
}
});

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{

navigator.serviceWorker.register("/sw.js");

});

}

</script>

</body>
</html>
